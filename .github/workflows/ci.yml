name: PayPilot CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Test Suites (53 Cases)
        run: npm test

      - name: Verify Next.js Production Build
        run: npm run build
        env:
          PAYPAL_ENVIRONMENT: sandbox
          DEMO_MODE: true
